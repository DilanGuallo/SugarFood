<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SugarFood - Tu Menú en Azca</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Estilo ultra-limpio solo para esta portada */
        body, html { height: 100%; margin: 0; overflow: hidden; }
        .hero-fullscreen {
            height: 100vh;
            background: linear-gradient(rgba(26, 26, 26, 0.4), rgba(26, 26, 26, 0.8)), url('https://images.unsplash.com/photo-1414235077428-338989a2e8c0?ixlib=rb-1.2.1&auto=format&fit=crop&w=1920&q=80') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
        }
        .hero-center {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }
    </style>
</head>
<body>

    <div class="hero-fullscreen">
        <header style="background: transparent; border: none; box-shadow: none;">
            <div class="container navbar">
                <div class="logo" style="color: #fff; text-shadow: 2px 2px 4px rgba(0,0,0,0.5);">SugarFood</div>
                <nav class="nav-links">
                    <button class="btn" style="background: transparent; color: white; border: 1px solid white;" id="headerLoginBtn">Iniciar Sesión</button>
                </nav>
            </div>
        </header>

        <div class="hero-center">
            <h1 style="color: var(--brand-color); font-size: 4.5rem; margin-bottom: 10px; text-shadow: 2px 2px 8px rgba(0,0,0,0.6);">SugarFood</h1>
            <p style="color: #fff; font-size: 1.5rem; margin-bottom: 40px; font-weight: 300; letter-spacing: 1px;">Alta gastronomía local, sin esperas.</p>
            
            <div style="display: flex; gap: 20px;">
                <button class="btn btn-brand" id="heroSignupBtn" style="padding: 16px 40px; font-size: 1.1rem;">Comenzar</button>
                <a href="info.html" class="btn" style="background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.3); padding: 16px 40px; font-size: 1.1rem; backdrop-filter: blur(5px);">Descubre el Proyecto</a>
            </div>
        </div>

        <div style="text-align: center; padding: 20px; color: rgba(255,255,255,0.5); font-size: 0.85rem;">
            &copy; 2026 SugarFood Azca - Proyecto de Machine Learning
        </div>
    </div>

    <div class="modal-overlay" id="authModal">
        <div class="modal-content luxury-modal">
            <span class="close-modal" id="closeModal">&times;</span>
            <div class="modal-header">
                <h2>Bienvenido a SugarFood</h2>
                <p class="modal-subtitle">Inicia sesión o crea tu cuenta para acceder al menú.</p>
            </div>
            <div class="modal-tabs">
                <button class="tab-btn active" id="loginTab">Entrar</button>
                <button class="tab-btn" id="signupTab">Registro</button>
            </div>

            <form id="loginForm" class="auth-form active">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <div class="input-icon">
                        <input type="email" id="loginEmail" placeholder="tucorreo@ejemplo.com" required>
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Contraseña</label>
                    <div class="input-icon">
                        <input type="password" id="loginPassword" placeholder="********" required>
                        <i class="fa-solid fa-lock"></i>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Entrar</button>
            </form>

            <form id="signupForm" class="auth-form">
                <div class="form-group">
                    <label for="signupName">Nombre</label>
                    <div class="input-icon">
                        <input type="text" id="signupName" placeholder="Tu nombre" required>
                        <i class="fa-solid fa-user"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label for="signupEmail">Email</label>
                    <div class="input-icon">
                        <input type="email" id="signupEmail" placeholder="tucorreo@ejemplo.com" required>
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label for="signupPassword">Contraseña</label>
                    <div class="input-icon">
                        <input type="password" id="signupPassword" placeholder="********" required>
                        <i class="fa-solid fa-lock"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label for="signupRole">Soy un...</label>
                    <select id="signupRole" class="luxury-select" required>
                        <option value="Cliente">Cliente (Busco comida)</option>
                        <option value="Restaurante">Restaurante (Subo menús)</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Crear Cuenta</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
