<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SugarFood - Panel de Restaurante</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray">

    <header>
        <div class="container navbar">
            <div class="logo" style="color: #e63946;">SugarFood <span style="font-size: 0.8rem; color: #666;">Para Restaurantes</span></div>
            <nav class="nav-links">
                <span>Hola, <strong>La Taberna</strong></span>
                <a href="index.html" style="color: #666; text-decoration: none;">Salir</a>
            </nav>
        </div>
    </header>

    <main class="container" style="padding: 40px 20px;">
        <h2 style="margin-bottom: 20px; color: #333;">Sube tu menú de hoy</h2>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px;">
            
            <div style="background: white; padding: 30px; border-radius: 12px; text-align: center; border: 2px dashed #ccc;">
                <i class="fas fa-camera" style="font-size: 3rem; color: #888; margin-bottom: 15px;"></i>
                <h3 style="margin-bottom: 10px;">Hazle una foto a tu menú</h3>
                <p style="color: #666; margin-bottom: 20px;">Nuestra IA leerá el texto escrito a mano o a máquina.</p>
                <input type="file" id="menuInput" style="display: none;">
                <label for="menuInput" class="btn" style="background-color: #333; color: white; cursor: pointer; display: inline-block;">Subir Imagen (JPG/PNG)</label>
            </div>

            <div style="background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
                <h3 style="margin-bottom: 15px; color: #e63946;"><i class="fas fa-robot"></i> Datos extraídos por IA</h3>
                
                <form>
                    <div class="form-group">
                        <label>Precio del Menú (€)</label>
                        <input type="text" value="Detectando..." id="ia-precio" readonly style="background: #f9f9f9;">
                    </div>
                    <div class="form-group">
                        <label>Primeros Platos</label>
                        <textarea rows="3" id="ia-primeros" readonly style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; background: #f9f9f9;">Esperando imagen...</textarea>
                    </div>
                    <div class="form-group">
                        <label>Segundos Platos</label>
                        <textarea rows="3" id="ia-segundos" readonly style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; background: #f9f9f9;">Esperando imagen...</textarea>
                    </div>
                    <button type="button" class="btn" style="background-color: #28a745; color: white; width: 100%; margin-top: 10px;">Publicar Menú Hoy</button>
                </form>
            </div>

        </div>
    </main>
    <footer class="app-footer">
        <div class="container app-footer-content">
            <p>&copy; 2026 SugarFood</p>
            <div class="app-footer-links">
                <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ&list=RDdQw4w9WgXcQ&start_radio=1&pp=ygUXbmV2ZXIgZ29ubmEgZ2l2ZSB5b3UgdXCgBwE%3D" target="_blank">Soporte</a>
                <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ&list=RDdQw4w9WgXcQ&start_radio=1&pp=ygUXbmV2ZXIgZ29ubmEgZ2l2ZSB5b3UgdXCgBwE%3D" target="_blank">Privacidad</a>
                <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ&list=RDdQw4w9WgXcQ&start_radio=1&pp=ygUXbmV2ZXIgZ29ubmEgZ2l2ZSB5b3UgdXCgBwE%3D" target="_blank">Términos</a>
            </div>
        </div>
    </footer>

</body>
</html>
